<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Pranjal Gupta — Builder's Universe</title>
  <desc id="desc">A deep-space grid with orbital lines framing the words PRANJAL and PRANJAL-DEBUG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070712"/>
      <stop offset="0.48" stop-color="#17102d"/>
      <stop offset="1" stop-color="#090b18"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#6d28d9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ff3f"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c4b5fd" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#d9ff3f" fill-opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="28" fill="url(#violet)"/>
  <rect x="24" y="24" width="1552" height="572" rx="20" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
    <ellipse cx="1190" cy="310" rx="320" ry="126" transform="rotate(-18 1190 310)" stroke="#a78bfa" stroke-opacity="0.34" stroke-width="2"/>
    <ellipse cx="1190" cy="310" rx="260" ry="86" transform="rotate(-18 1190 310)" stroke="#d9ff3f" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse cx="1190" cy="310" rx="390" ry="170" transform="rotate(-18 1190 310)" stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1"/>
    <path d="M855 450C1010 350 1160 265 1445 190" stroke="#d9ff3f" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="5 12"/>
  </g>

  <g fill="#fff">
    <circle cx="105" cy="116" r="2" opacity="0.8"/><circle cx="218" cy="493" r="1.5" opacity="0.55"/>
    <circle cx="431" cy="106" r="1.5" opacity="0.7"/><circle cx="723" cy="522" r="2" opacity="0.5"/>
    <circle cx="1404" cy="96" r="1.5" opacity="0.75"/><circle cx="1512" cy="468" r="2" opacity="0.65"/>
  </g>
  <g fill="#d9ff3f" filter="url(#glow)">
    <circle cx="1026" cy="181" r="4"/><circle cx="1398" cy="344" r="3"/>
  </g>

  <g transform="translate(120 126)">
    <text x="0" y="0" fill="#d9ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="5">/ BUILDERS_UNIVERSE / 001</text>
    <text x="-4" y="150" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="138" font-weight="800" letter-spacing="-8">PRANJAL</text>
    <text x="4" y="210" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="9">PRANJAL-DEBUG</text>
    <rect x="5" y="250" width="640" height="2" fill="url(#lime)" opacity="0.9"/>
    <text x="4" y="302" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="500">Useful software for messy, real-world problems.</text>
    <text x="4" y="346" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">FULL-STACK SYSTEMS  ·  PRACTICAL AI  ·  DESKTOP TOOLS</text>
  </g>

  <g transform="translate(1160 266)">
    <circle cx="0" cy="0" r="92" fill="#0b0b1a" fill-opacity="0.6" stroke="#c4b5fd" stroke-opacity="0.28"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#d9ff3f" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#d9ff3f" filter="url(#glow)"/>
    <path d="M-132 0H-96M96 0H132M0-132V-96M0 96V132" stroke="#d9ff3f" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </g>

  <g transform="translate(120 548)" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">
    <text x="0" y="0">CURIOSITY → CODE → ITERATION → IMPACT</text>
    <text x="1190" y="0">STATUS: SHIPPING</text>
  </g>
</svg>
