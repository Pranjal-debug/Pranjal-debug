<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity fallback for Pranjal-debug</title>
  <desc id="desc">A static fallback explaining that the live public activity graphic is waiting for a successful GitHub API refresh. No activity counts are simulated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070712"/><stop offset="0.55" stop-color="#17102d"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9ff3f"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#c4b5fd" stroke-opacity="0.08"/></pattern>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="560" rx="28" fill="url(#grid)"/>
  <text x="72" y="82" fill="#d9ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="4">LIVE ACTIVITY / FALLBACK</text>
  <text x="72" y="142" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800">PUBLIC SIGNAL WAITING FOR A REFRESH</text>
  <rect x="72" y="190" width="1256" height="190" rx="18" fill="#0b1220" fill-opacity="0.92" stroke="#334155"/>
  <circle cx="126" cy="260" r="18" fill="none" stroke="url(#lime)" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="174" y="258" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">No live values are being invented.</text>
  <text x="174" y="294" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">The scheduled workflow reads public GitHub repositories and events,</text>
  <text x="174" y="320" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">validates the generated SVG, then replaces this fallback only on success.</text>
  <text x="72" y="462" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">SOURCE: GITHUB REST API  ·  COVERAGE: RECENT PUBLIC EVENTS WINDOW</text>
  <text x="72" y="510" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">PRANJAL-DEBUG  ·  STATIC SAFE STATE</text>
</svg>
