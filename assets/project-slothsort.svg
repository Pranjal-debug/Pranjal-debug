  <g transform="translate(74 566)" font-family="ui-monospace, monospace" font-size="15">
    <text fill="#c4b5fd">ELECTRON</text><text x="125" fill="#64748b">·</text><text x="148" fill="#c4b5fd">REACT</text><text x="248" fill="#64748b">·</text><text x="271" fill="#c4b5fd">TYPESCRIPT</text><text x="420" fill="#64748b">·</text><text x="443" fill="#c4b5fd">OLLAMA</text>
    <text x="1000" fill="#86efac">HUMAN APPROVAL REQUIRED</text>
