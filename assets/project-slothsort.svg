        <rect width="210" height="170" rx="12" fill="#111c2d" stroke="#334155"/>
        <text x="22" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">04 / RECOVER</text>
        <path d="M64 106a40 40 0 1 1 66-32" fill="none" stroke="#d9ff3f" stroke-width="7" stroke-linecap="round"/><path d="m128 60 8 15-17-1" fill="none" stroke="#d9ff3f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="154" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="14">SHA-256 · JSONL JOURNAL</text>
      </g>
    </g>
