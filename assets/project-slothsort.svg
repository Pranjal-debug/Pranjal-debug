<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">SlothSort project visual</title>
  <desc id="desc">A dark local-AI workflow showing a folder scan, review queue, approval gate, and undo journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#111a2a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.08"/></pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1400" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="640" rx="28" fill="url(#grid)"/>
  <circle cx="1130" cy="120" r="160" fill="#7c3aed" fill-opacity="0.16" filter="url(#soft)"/>
  <g transform="translate(74 66)">
    <text fill="#d9ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="4">THE PRIVACY LAB  /  01</text>
    <text y="74" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">SLOTHSORT</text>
    <text y="112" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">Local AI file organization with a human approval gate.</text>
  </g>
  <g transform="translate(74 236)">
    <rect width="1252" height="272" rx="18" fill="#0b1220" fill-opacity="0.9" stroke="#334155"/>
    <g transform="translate(34 34)">
      <g>
        <rect width="210" height="170" rx="12" fill="#111c2d" stroke="#334155"/>
        <text x="22" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">01 / INPUT</text>
        <path d="M26 76h42l14 15h90v52H26z" fill="#172554" stroke="#60a5fa"/>
        <text x="26" y="154" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="14">SELECT FOLDER</text>
      </g>
      <path d="M230 85H282" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><path d="m274 76 12 9-12 9" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <g transform="translate(300)">
        <rect width="210" height="170" rx="12" fill="#111c2d" stroke="#334155"/>
        <text x="22" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">02 / LOCAL AI</text>
        <circle cx="72" cy="95" r="32" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/><circle cx="72" cy="95" r="9" fill="#d9ff3f"/>
        <path d="M112 80h70M112 100h52M112 120h62" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
        <text x="26" y="154" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="14">OLLAMA · GEMMA 3:4B</text>
      </g>
      <path d="M530 85H582" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><path d="m574 76 12 9-12 9" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <g transform="translate(600)">
        <rect width="250" height="170" rx="12" fill="#111c2d" stroke="#334155"/>
        <text x="22" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2">03 / REVIEW QUEUE</text>
        <rect x="24" y="58" width="196" height="22" rx="6" fill="#172033"/><rect x="24" y="90" width="160" height="22" rx="6" fill="#172033"/><rect x="24" y="122" width="182" height="22" rx="6" fill="#172033"/>
        <circle cx="207" cy="69" r="5" fill="#d9ff3f"/><circle cx="171" cy="101" r="5" fill="#22d3ee"/><circle cx="193" cy="133" r="5" fill="#a78bfa"/>
      </g>
      <path d="M870 85H922" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><path d="m914 76 12 9-12 9" fill="none" stroke="#a78bfa" stroke-width="3"/>
